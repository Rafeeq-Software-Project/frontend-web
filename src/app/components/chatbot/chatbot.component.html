<!-- Floating Chat Button -->
<button class="chat-toggle" (click)="toggleChat()" [class.active]="isOpen" aria-label="Toggle Chatbot">
  <div class="glow-layer"></div>
  <svg *ngIf="!isOpen" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </svg>
  <svg *ngIf="isOpen" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </svg>
</button>

<!-- Chat Window -->
<div class="chat-window" [class.open]="isOpen">
  <div class="chat-header">
    <div class="bot-info">
      <div class="bot-avatar">
        <img src="assets/logo-1.webp" alt="Rafeeq Logo">
        <span class="status-indicator"></span>
      </div>
      <div class="bot-details">
        <h3>Rafeeq AI</h3>
        <p>Online | Active</p>
      </div>
    </div>
    <button class="close-btn" (click)="toggleChat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>
  </div>

  <div class="messages-container" #scrollContainer>
    <div *ngFor="let msg of messages" [class]="'message ' + msg.sender">
      <div class="message-content">
        {{ msg.text }}
        <span class="timestamp">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>
    </div>

    <!-- Typing Indicator -->
    <div *ngIf="isLoading" class="message bot">
      <div class="message-content typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <form class="chat-input" (submit)="sendMessage()">
    <input 
      type="text" 
      name="userInput" 
      [(ngModel)]="userInput" 
      placeholder="Type your message..." 
      autocomplete="off"
      [disabled]="isLoading"
    >
    <button type="submit" [disabled]="!userInput.trim() || isLoading">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>
</div>
