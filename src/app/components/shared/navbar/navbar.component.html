<!-- ============ HEADER / NAV ============ -->
<header class="main-header" [class.scrolled]="isScrolled">
    <div class="header-content">

        <!-- Logo -->
        <a routerLink="/" class="logo-link">
            <img src="assets/logo-1.webp" alt="Rafeeq Logo" class="brand-logo">
        </a>

        <!-- Desktop Nav -->
        <nav class="desktop-nav">
            <a routerLink="/" class="nav-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/who-is-rafeeq" class="nav-link" routerLinkActive="active">About</a>
            <a routerLink="/login" class="nav-link">Login</a>

            <!-- Theme Toggle -->
            <button class="theme-toggle-nav" (click)="toggleTheme($event)"
                [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
                <div class="theme-icon-wrapper" [class.dark]="isDarkMode">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Stars for Dark Mode -->
                        <g class="stars">
                            <circle cx="17" cy="5" r="0.5" fill="currentColor" />
                            <circle cx="14" cy="2" r="0.4" fill="currentColor" />
                            <circle cx="21" cy="8" r="0.6" fill="currentColor" />
                        </g>

                        <mask id="moon-mask-desktop">
                            <rect x="0" y="0" width="24" height="24" fill="white" />
                            <circle class="moon-mask-circle" cx="24" cy="10" r="10" fill="black" />
                        </mask>

                        <circle class="sun-main" cx="12" cy="12" r="5" mask="url(#moon-mask-desktop)"
                            fill="currentColor" />

                        <g class="sun-rays" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </g>
                    </svg>
                </div>
            </button>

            <a routerLink="/signin" class="btn-nav">
                Join Now
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </nav>

        <!-- Mobile actions -->
        <div class="mobile-actions">
            <!-- Theme Toggle -->
            <button class="theme-toggle-nav mobile" (click)="toggleTheme($event)"
                [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
                <div class="theme-icon-wrapper" [class.dark]="isDarkMode">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Stars for Dark Mode -->
                        <g class="stars">
                            <circle cx="17" cy="5" r="0.5" fill="currentColor" />
                            <circle cx="14" cy="2" r="0.4" fill="currentColor" />
                            <circle cx="21" cy="8" r="0.6" fill="currentColor" />
                        </g>

                        <mask id="moon-mask-mobile">
                            <rect x="0" y="0" width="24" height="24" fill="white" />
                            <circle class="moon-mask-circle" cx="24" cy="10" r="10" fill="black" />
                        </mask>

                        <circle class="sun-main" cx="12" cy="12" r="5" mask="url(#moon-mask-mobile)"
                            fill="currentColor" />

                        <g class="sun-rays" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </g>
                    </svg>
                </div>
            </button>

            <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Toggle Menu">
                <div class="hamburger" [class.open]="isMenuOpen">
                    <span></span><span></span><span></span>
                </div>
            </button>
        </div>
    </div>
</header>

<!-- ============ SIDEBAR ============ -->
<div class="sidebar-backdrop" [class.active]="isMenuOpen" (click)="closeMenu()"></div>
<aside class="sidebar" [class.open]="isMenuOpen">
    <div class="sidebar-header">
        <a routerLink="/" class="logo-link" (click)="closeMenu()">
            <img src="assets/logo-1.webp" alt="Rafeeq Logo" class="brand-logo">
        </a>
        <button class="sidebar-close" (click)="closeMenu()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12" />
            </svg>
        </button>
    </div>

    <nav class="sidebar-nav">
        <a routerLink="/" class="sidebar-link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">
            <div class="sidebar-link-icon">
                <i class="fas fa-home"></i>
            </div>
            <span>Home</span>
        </a>
        <a routerLink="/who-is-rafeeq" class="sidebar-link" routerLinkActive="active" (click)="closeMenu()">
            <div class="sidebar-link-icon">
                <i class="fas fa-info-circle"></i>
            </div>
            <span>About Rafeeq</span>
        </a>
        <a routerLink="/login" class="sidebar-link" (click)="closeMenu()">
            <div class="sidebar-link-icon">
                <i class="fas fa-sign-in-alt"></i>
            </div>
            <span>Login</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a routerLink="/signin" class="btn-nav sidebar-cta" (click)="closeMenu()">
            Join Now
        </a>
        <p class="sidebar-note">Access to premium features</p>
    </div>
</aside>
